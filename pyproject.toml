[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-portfolio"
version = "0.1.0"
description = "Transatlantic Long-Only quantitative asset allocation and regime-hedged equity portfolio system"
readme = "GEMINI.md"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.5.0",
    "hmmlearn>=0.3.0",
    "lightgbm>=4.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "blpapi>=3.26.7.1",
    "xbbg>=1.4.6",
    "streamlit>=1.66.0",
    "plotly>=7.1.0",
]

[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = false

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
quant-portfolio = "quant_portfolio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_portfolio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "cvxpy",
    "cvxpy.*",
    "hmmlearn",
    "hmmlearn.*",
    "lightgbm",
    "lightgbm.*",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
    "blpapi",
    "blpapi.*",
    "xbbg",
    "xbbg.*",
    "streamlit",
    "streamlit.*",
    "plotly",
    "plotly.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
